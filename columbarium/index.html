<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>東京霊園 納骨堂 — ご案内</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#14110f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="css/columbarium.css?v=1" />
    <!-- Pins this device to its columbarium (tenant). Runs before modules. -->
    <script src="js/config.js?v=1"></script>
  </head>
  <body class="booting">
    <!-- ===================== STATE 1 — WELCOME ===================== -->
    <section id="screen-welcome" class="screen">
      <div class="bg"></div>
      <div class="welcome-inner">
        <p class="welcome-lead" data-i18n="welcomeLead">ご案内システム</p>
        <h1 class="welcome-title" data-i18n="welcomeTitle">東京霊園 納骨堂</h1>
        <p class="welcome-sub" data-i18n="welcomeSub">
          お名前または区画番号から、ご遺骨の場所をご案内します
        </p>
        <div class="welcome-guide" data-i18n="welcomeGuide">画面にふれてはじめてください</div>
      </div>
    </section>

    <!-- ===================== STATE 2 — SEARCH ====================== -->
    <section id="screen-search" class="screen">
      <div class="bg"></div>

      <div class="search-topbar">
        <button id="backWelcomeBtn" class="btn btn-ghost" data-i18n="backToWelcome">
          最初にもどる
        </button>
        <span class="search-heading" data-i18n="searchHeading">検索</span>
        <span class="spacer"></span>
        <span id="offlineBadge" class="offline-badge" data-i18n="offlineBadge">オフライン</span>
      </div>

      <!-- Results fill the open area to the left of the search panel. -->
      <div id="results" class="results"></div>

      <div class="search-panel">
        <div class="mode-tabs">
          <button id="tabName" class="mode-tab active" data-i18n="tabName">お名前でさがす</button>
          <button id="tabSection" class="mode-tab" data-i18n="tabSection">区画番号でさがす</button>
        </div>

        <div class="panel-body">
          <!-- Mode B — name (kana) -->
          <div id="panel-name">
            <div class="field">
              <input id="nameInput" type="text" readonly inputmode="none" autocomplete="off" />
            </div>
            <div id="kanaKeyboard" style="margin-top:12px"></div>
          </div>

          <!-- Mode A — section ID -->
          <div id="panel-section" class="hidden">
            <div class="field">
              <input id="sectionInput" type="text" readonly inputmode="none" autocomplete="off" />
            </div>
            <div id="sectionKeypad" class="keypad-grid" style="margin-top:12px"></div>
          </div>

          <div class="field" style="justify-content:flex-end">
            <button id="clearBtn" class="btn btn-ghost" data-i18n="clearBtn">全消去</button>
            <button id="searchBtn" class="btn btn-primary" data-i18n="searchBtn">検索</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= STATE 3/4 — MAP ============= -->
    <section id="screen-map" class="screen">
      <div class="bg"></div>

      <div class="map-topbar">
        <div class="map-label">
          <span id="mapName" class="map-name">—</span>
          <span id="mapSection" class="map-section"></span>
        </div>
        <button class="btn js-end top-end" data-i18n="endBtn">終了</button>
      </div>

      <!-- STATE 3 — 2D floor map -->
      <div id="map2d" class="map-layer">
        <div id="mapViewport" class="map-viewport">
          <div id="mapWorld" class="map-world"></div>
        </div>
        <div class="map-hint" data-i18n="mapZoomHint">拡大するか、光っている区画にふれてください</div>
      </div>

      <!-- STATE 4 — 2.5D niche detail -->
      <div id="map25d" class="map-layer hidden">
        <div class="niche-caption"><span id="nicheLabel"></span></div>
        <div class="niche-scene">
          <div id="nicheWall" class="niche-wall"></div>
        </div>
        <button id="backTo2d" class="btn btn-ghost map-back" data-i18n="mapBack">◀ 地図にもどる</button>
      </div>
    </section>

    <script type="module" src="js/app.js?v=1"></script>
  </body>
</html>
