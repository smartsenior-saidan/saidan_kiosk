<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ログイン — デジタル祭壇</title>
    <!-- Resolve theme before paint to avoid a flash of the wrong mode -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("ss_theme");
          var t = s || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="css/login.css?v=6" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">

        <div class="login-brand">
          <div class="login-logo">S</div>
          <h1 class="login-title">デジタル祭壇</h1>
          <p class="login-subtitle">管理画面</p>
        </div>

        <div id="loginStatus" class="login-status hidden"></div>

        <form id="loginForm" autocomplete="on" novalidate>
          <div class="field">
            <label for="email">メールアドレス</label>
            <input
              id="email"
              type="email"
              placeholder="you@temple.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="field">
            <label for="password">パスワード</label>
            <input
              id="password"
              type="password"
              placeholder="パスワード"
              autocomplete="current-password"
              required
            />
          </div>

          <button id="signInBtn" type="submit" class="btn-primary">
            ログイン
          </button>
        </form>

        <div class="login-divider"><span>または</span></div>

        <button id="googleBtn" type="button" class="btn-google">
          <svg class="google-icon" viewBox="0 0 18 18" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.96H.96a9 9 0 0 0 0 8.08l3.01-2.32z"/>
            <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3.01 2.32C4.68 5.16 6.66 3.58 9 3.58z"/>
          </svg>
          <span>Google でログイン</span>
        </button>

        <button id="forgotBtn" type="button" class="btn-forgot">
          パスワードをお忘れですか？
        </button>

      </div>
    </div>

    <script type="module" src="js/login.js?v=6"></script>
  </body>
</html>
